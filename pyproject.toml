[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "korea-daily"
version = "0.1.0"
description = "Evidence-first Korean market daily report"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
korea-daily = "korea_daily.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
